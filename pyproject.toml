[project]
name = "goway-lib"
version = "0.1.0"
description = "Shared library for GoWay Python services: db, repo, errors, pagination, outbox, auth, telemetry"
readme = "README.md"
authors = [
    { name = "Asliddin", email = "asliddinabdumannonov06@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiobotocore>=3.9.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.143.5,<0.144",
    "httpx>=0.28.1",
    "nats-py>=2.15.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-logging>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "redis>=8.1.0",
    "sentry-sdk>=2.68.0",
    "sqlalchemy[asyncio]>=2.0.52",
]

[project.scripts]
goway-lint-migrations = "goway_lib.migration_lint:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
# B: bugbear, likely bugs; S: bandit, security smells. Tests may assert and carry fixture secrets.
select = ["E", "F", "I", "W", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S311", "S603", "S607"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
